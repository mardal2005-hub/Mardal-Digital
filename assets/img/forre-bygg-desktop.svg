<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Forhåndsvisning av Førre Bygg-nettsiden">
  <defs>
    <linearGradient id="fbHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a322c"/>
      <stop offset="1" stop-color="#201c19"/>
    </linearGradient>
    <linearGradient id="fbPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8622d"/>
      <stop offset="0.55" stop-color="#a04d22"/>
      <stop offset="1" stop-color="#2a2320"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="1280" height="800" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <!-- window -->
    <rect width="1280" height="800" fill="#ece7dd"/>

    <!-- browser chrome -->
    <rect width="1280" height="46" fill="#dfd8cb"/>
    <circle cx="28" cy="23" r="6" fill="#c8622d"/>
    <circle cx="50" cy="23" r="6" fill="#c9a24e"/>
    <circle cx="72" cy="23" r="6" fill="#8a8378"/>
    <rect x="120" y="13" width="700" height="20" rx="10" fill="#ece7dd"/>
    <text x="140" y="27" font-size="12" fill="#8a8378">forrebygg.no</text>

    <!-- site nav -->
    <g transform="translate(0,46)">
      <rect width="1280" height="70" fill="#ece7dd"/>
      <text x="64" y="44" font-size="22" font-weight="800" letter-spacing="1" fill="#241f1c">FØRRE BYGG</text>
      <g font-size="13" fill="#3a322c" font-weight="600">
        <text x="720" y="43">Tjenester</text>
        <text x="820" y="43">Prosjekter</text>
        <text x="928" y="43">Om oss</text>
      </g>
      <rect x="1010" y="20" width="120" height="34" rx="0" fill="#c8622d"/>
      <text x="1070" y="42" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Kontakt oss</text>
      <rect x="0" y="69" width="1280" height="1" fill="#d4ccbd"/>
    </g>

    <!-- hero -->
    <g transform="translate(0,116)">
      <rect width="1280" height="430" fill="url(#fbHero)"/>
      <!-- left copy -->
      <text x="64" y="90" font-size="13" font-weight="700" letter-spacing="3" fill="#c8622d">BYGGEFIRMA · HAUGALANDET</text>
      <text x="60" y="185" font-size="86" font-weight="800" letter-spacing="-2" fill="#f2ede4">Vi bygger</text>
      <text x="60" y="270" font-size="86" font-weight="800" letter-spacing="-2" fill="#f2ede4">det som <tspan fill="#c8622d">varer.</tspan></text>
      <text x="64" y="325" font-size="16" fill="#b8afa2">Solid håndverk fra grunnmur til ferdig tak.</text>
      <text x="64" y="350" font-size="16" fill="#b8afa2">Nybygg, tilbygg og rehabilitering på Haugalandet.</text>
      <rect x="64" y="378" width="180" height="46" fill="#c8622d"/>
      <text x="154" y="407" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Se prosjektene våre</text>
      <rect x="256" y="378" width="150" height="46" fill="none" stroke="#6d635a"/>
      <text x="331" y="407" font-size="14" font-weight="700" fill="#e6ddd0" text-anchor="middle">Be om tilbud</text>

      <!-- right photo block -->
      <rect x="800" y="46" width="416" height="338" fill="url(#fbPhoto)"/>
      <!-- house silhouette -->
      <g opacity="0.9">
        <path d="M860 300 L860 210 L1008 130 L1156 210 L1156 300 Z" fill="#241f1c" opacity="0.35"/>
        <path d="M900 300 L900 230 L1008 172 L1116 230 L1116 300 Z" fill="#0f0d0c" opacity="0.4"/>
        <rect x="985" y="250" width="46" height="50" fill="#c8622d" opacity="0.9"/>
      </g>
      <rect x="800" y="46" width="416" height="338" fill="none" stroke="#4a4038"/>
      <text x="820" y="370" font-size="11" letter-spacing="2" fill="#f2ede4" opacity="0.7">PROSJEKT — FØRRE, 2026</text>
    </g>

    <!-- services / project strip -->
    <g transform="translate(0,566)">
      <rect width="1280" height="234" fill="#ece7dd"/>
      <text x="64" y="52" font-size="13" font-weight="700" letter-spacing="2" fill="#8a8378">HVA VI GJØR</text>

      <g font-family="'Helvetica Neue', Arial, sans-serif">
        <!-- card 1 -->
        <rect x="64" y="74" width="368" height="128" fill="#fff"/>
        <rect x="64" y="74" width="368" height="4" fill="#c8622d"/>
        <text x="88" y="120" font-size="22" font-weight="800" fill="#241f1c">Nybygg</text>
        <text x="88" y="150" font-size="13" fill="#6d635a">Bolig og næring, bygget fra bunnen</text>
        <text x="88" y="170" font-size="13" fill="#6d635a">med kvalitet i hvert ledd.</text>
        <!-- card 2 -->
        <rect x="456" y="74" width="368" height="128" fill="#fff"/>
        <rect x="456" y="74" width="368" height="4" fill="#8a8378"/>
        <text x="480" y="120" font-size="22" font-weight="800" fill="#241f1c">Tilbygg</text>
        <text x="480" y="150" font-size="13" fill="#6d635a">Mer plass, sømløst tilpasset</text>
        <text x="480" y="170" font-size="13" fill="#6d635a">det eksisterende bygget.</text>
        <!-- card 3 -->
        <rect x="848" y="74" width="368" height="128" fill="#fff"/>
        <rect x="848" y="74" width="368" height="4" fill="#241f1c"/>
        <text x="872" y="120" font-size="22" font-weight="800" fill="#241f1c">Rehab</text>
        <text x="872" y="150" font-size="13" fill="#6d635a">Vi gir eldre bygg nytt liv,</text>
        <text x="872" y="170" font-size="13" fill="#6d635a">innvendig og utvendig.</text>
      </g>
    </g>
  </g>
</svg>
