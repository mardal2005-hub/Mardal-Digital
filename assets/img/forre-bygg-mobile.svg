<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 700" width="340" height="700" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Førre Bygg-nettsiden på mobil">
  <defs>
    <linearGradient id="mHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a322c"/>
      <stop offset="1" stop-color="#201c19"/>
    </linearGradient>
    <linearGradient id="mPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8622d"/>
      <stop offset="1" stop-color="#2a2320"/>
    </linearGradient>
    <clipPath id="screen"><rect x="16" y="16" width="308" height="668" rx="30"/></clipPath>
  </defs>

  <!-- phone body -->
  <rect x="4" y="4" width="332" height="692" rx="42" fill="#141210"/>
  <rect x="10" y="10" width="320" height="680" rx="36" fill="#000"/>

  <g clip-path="url(#screen)">
    <rect x="16" y="16" width="308" height="668" fill="#ece7dd"/>

    <!-- status bar -->
    <text x="34" y="42" font-size="11" font-weight="700" fill="#241f1c">9:41</text>
    <rect x="278" y="33" width="22" height="10" rx="2" fill="#241f1c"/>

    <!-- top bar -->
    <text x="34" y="78" font-size="15" font-weight="800" letter-spacing="0.5" fill="#241f1c">FØRRE BYGG</text>
    <g stroke="#241f1c" stroke-width="2">
      <line x1="284" y1="70" x2="306" y2="70"/>
      <line x1="284" y1="77" x2="306" y2="77"/>
      <line x1="284" y1="84" x2="306" y2="84"/>
    </g>

    <!-- hero -->
    <rect x="16" y="96" width="308" height="330" fill="url(#mHero)"/>
    <text x="34" y="138" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c8622d">BYGGEFIRMA · HAUGALANDET</text>
    <text x="32" y="182" font-size="38" font-weight="800" letter-spacing="-1" fill="#f2ede4">Vi bygger</text>
    <text x="32" y="222" font-size="38" font-weight="800" letter-spacing="-1" fill="#f2ede4">det som</text>
    <text x="32" y="262" font-size="38" font-weight="800" letter-spacing="-1" fill="#c8622d">varer.</text>
    <text x="34" y="298" font-size="12" fill="#b8afa2">Solid håndverk fra grunnmur</text>
    <text x="34" y="316" font-size="12" fill="#b8afa2">til ferdig tak.</text>
    <rect x="34" y="338" width="180" height="42" fill="#c8622d"/>
    <text x="124" y="365" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Se prosjektene</text>

    <!-- photo block -->
    <rect x="16" y="426" width="308" height="150" fill="url(#mPhoto)"/>
    <path d="M120 540 L120 500 L200 458 L280 500 L280 540 Z" fill="#0f0d0c" opacity="0.4"/>
    <rect x="184" y="516" width="30" height="24" fill="#c8622d" opacity="0.9"/>

    <!-- cards -->
    <rect x="16" y="576" width="308" height="108" fill="#ece7dd"/>
    <rect x="34" y="596" width="272" height="70" fill="#fff"/>
    <rect x="34" y="596" width="272" height="3" fill="#c8622d"/>
    <text x="50" y="628" font-size="16" font-weight="800" fill="#241f1c">Nybygg</text>
    <text x="50" y="650" font-size="11" fill="#6d635a">Bygget fra bunnen, med kvalitet.</text>
  </g>

  <!-- notch -->
  <rect x="132" y="20" width="76" height="20" rx="10" fill="#000"/>
</svg>
